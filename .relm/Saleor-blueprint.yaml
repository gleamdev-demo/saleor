version: 1
blueprintId: 43146a09-c439-4751-9e79-a39aaca50454

visibility: public

instructions: |
  You are working on Saleor, an open-source e-commerce platform (Python 3.12, Django, GraphQL API).
  Follow AGENTS.md and the skills in .claude/skills/.
  Dependencies are installed system-wide: run `pytest` and `./manage.py` directly, no virtualenv.
  Postgres (seeded with the sample store) and Valkey run next to you on localhost.
  Work on a new branch, keep the change focused, and run only the tests the issue names: the full
  suite takes over 20 minutes, so leave it to CI. Push the branch, then open the pull request with
  `gh pr create --head <branch>` (in this fork, gh doesn't pick up the pushed branch on its own).

suggestedPrompts:
  - Pick the oldest open issue in this repo, fix it, and open a pull request.
  - Run the checkout tests and summarize any failures.
  - Explain how an order moves from checkout to fulfillment in this codebase.

allowedCodingAgents:
  claude-code:            # first model is the default
    - claude-opus-5-5
    - claude-sonnet-5-5

repositories:
  - repo: gleamdev-demo/saleor
    clone:
      depth: 1

agentEnv:
  LANG: C.UTF-8                     # the image has no locale; under POSIX, bash miscounts the prompt's ➜ and garbles wrapped lines
  CACHE_URL: redis://localhost:6379/0
  DEFAULT_CHANNEL_SLUG: default-channel
  HTTP_IP_FILTER_ALLOW_LOOPBACK_IPS: "True"
  PYTEST_ADDOPTS: --reuse-db -n 2   # test DBs are pre-built in the saleor-db image
  GH_REPO: gleamdev-demo/saleor     # this repo is a fork: without it, `gh pr create` targets upstream saleor/saleor

connectors:
  - name: Saleor Production   # the live store's API; no `access:`, so read and write

image:
  spec: Saleor workspace

agentResources:
  spec: Demo 2 CPU

services:
  db:
    image: ghcr.io/gleamdev-demo/saleor-db:1383f63   # a build SHA, not :latest (nodes cache :latest)
    port: 5432
    resources: { cpu: 500m, memory: 1Gi }
  cache:
    image: docker.io/valkey/valkey:8.1-alpine
    port: 6379
    resources: { cpu: 100m, memory: 256Mi }
