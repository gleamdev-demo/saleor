# Builds the two images the Relm demo blueprint runs:
#   saleor-workspace  the agent container (Python 3.12 + all dependencies)
#   saleor-db         Postgres 15 with migrations applied and the populatedb sample store loaded
# Upstream Saleor workflows are parked in .github/upstream-workflows/ so they don't run on this fork.
name: Relm demo images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".relm/images/**", "uv.lock", "pyproject.toml", ".github/workflows/relm-images.yml"]
permissions:
  contents: read
  packages: write
env:
  WS_IMAGE: ghcr.io/gleamdev-demo/saleor-workspace
  DB_IMAGE: ghcr.io/gleamdev-demo/saleor-db
  SOURCE: https://github.com/${{ github.repository }}
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build workspace image
        run: |
          docker build -f .relm/images/workspace.Dockerfile \
            --label org.opencontainers.image.source=$SOURCE \
            -t $WS_IMAGE:latest -t $WS_IMAGE:${GITHUB_SHA::7} .
      - name: Build seeded database image
        run: |
          docker network create saleor
          docker run -d --name db --network saleor \
            -e POSTGRES_USER=saleor -e POSTGRES_PASSWORD=saleor -e PGDATA=/pgdata postgres:15
          until docker exec db pg_isready -U saleor; do sleep 1; done
          docker run --rm --network saleor -v "$PWD:/app" -w /app \
            -e DATABASE_URL=postgres://saleor:saleor@db/saleor -e SECRET_KEY=changeme \
            $WS_IMAGE:latest sh -c "python manage.py migrate --no-input && python manage.py populatedb --createsuperuser"
          docker exec db psql -U saleor -c 'CHECKPOINT;'
          docker stop db
          docker commit --change 'ENV PGDATA=/pgdata' --change "LABEL org.opencontainers.image.source=$SOURCE" \
            db $DB_IMAGE:latest
          docker tag $DB_IMAGE:latest $DB_IMAGE:${GITHUB_SHA::7}
      - name: Push
        run: |
          docker push --all-tags $WS_IMAGE
          docker push --all-tags $DB_IMAGE
